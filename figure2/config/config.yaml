# config.yaml
stacksDir: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/software/stacks-2.65/" # Where to find the stacks program(s)
shadowLevel: "shallow" # What level to shadow jobs at 

ref: "ref/phlox_pilo.v1.fasta"

metadata: "metadata.tsv"

bamDir: "results/sort"

species:
  multi:
    cusp_drum_roem_pilo: ["cusp", "drum", "roem", "pilo"]
    cusp_drum_roem: ["cusp", "drum", "roem"]
    # cusp_drum: ["cusp", "drum"]
    # drum_roem: ["drum", "roem"]
  single:
    cusp: ["cusp"]
    drum: ["drum"]
    roem: ["roem"]
  # outgroup:
  #   pilo: ["pilo"]

# comma-separated samples to remove
removeSamples: "675-2,725_12" # These individuals are mislabeled

filterSettings:
  min_DP: 4
  max_DP: 200
  min_GQ: 30

# Maximum missing gt proportion per sample
mindValues: [0.25, 0.5, 0.75, 0.9] # Smaller values => more stringent

##############################
# Analyses
plinkDir: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/software/plink_linux"

pcaParams:
  ldPrune: "50 10 0.1"
  # maf: 0.05
  # mac: 1 # mac or more minor alleles
  # mind: 0.5 # individuals missing > mind% of snp data are removed
  # geno: 0.5 # snps missing > geno% of data across individuals are removed
  hwe: 1e-16 # snps below p-value for HWE test are removed
  
pcaImputeParams:
  ldPrune: "50 10 0.1"
  maf: 0.025 # snps below maf are removed
  hwe: 1e-16 # snps below p-value for HWE test are removed
  maxiter: 10  # Number of iterations to test

# fstParams:
#   useSuperPop: True
#   windowSize: 1000000

pixyParams:
  windowSize: 100000
  minChromSize: 10000000 # (10 Mb) Minimum contig size to include
  # dxy:
  #   windowSize: 1000000
  # pi:
  #   windowSize: 1000000
  # fst:
  #   useSuperPop: True
  #   windowSize: 1000000
  # fstInter:
  #   windowSize: 1000000

#####################
# Dsuite
DsuiteCmd: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/software/Dsuite/Build/Dsuite"

#####################
# Admixture
admixDir: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/software/admixture_linux-1.3.0"
admixParams:
  kVals: [1, 2, 3, 4, 5, 6, 7, 8]
  nReps: 3 # How many reseeded replicates to run per kval
  ldPrune: "50 10 0.1"
  hwe: 1e-16 # snps below p-value for HWE test are removed
  # maf: 0.05
  # mac: 1 # mac or more minor alleles
  # mind: 0.85 # individuals missing > mind% of snp data are removed
  # geno: 0.5 # snps missing > geno% of data across individuals are removed

#####################
# Dsuite
DsuiteDir: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/software/Dsuite/Build/Dsuite"

#####################
# Treemix
treemixDir: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/software/treemix-1.13/src"
treemixParams:
  m: 1 # Number of migration events allowed

#####################
# Eems
eemsRunEems: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/src/eems/runeems_snps/src/runeems_snps"
eemsBed2Diffs: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/src/eems/bed2diffs/src/bed2diffs_v2"
eemsHabitatDir: "eems_params/habitats/" # Where habitat definitions are stored
eemsParams:
  rmSampsPath: "eems_params/samples.ignore.list" # Samples to be rm-ed b/c admixed; set to "" if none
  nDemes: 350 # How densely to plot the grid
  diploid: "true"
  numMCMCIter: 10000000 # MCMC parameters
  numBurnIter:  1000000
  numThinIter: 9999
  ldPrune: "50 10 0.1"
  maf: 0.05
  mac: 1 # mac or more minor alleles
  hwe: 1e-16 # snps below p-value for HWE test are removed
