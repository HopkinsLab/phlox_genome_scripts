####################################

# The directory containing the stacks software suite
stacksDir: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/software/stacks-2.65/"

####################################
# Trimmomatic
####################################
# The trimmomatic executable
trimmomaticJar: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/software/Trimmomatic-0.39/trimmomatic-0.39.jar" # Make sure to load java (e.g., `module load jdk/10.0.1-fasrc01`)

# Trimmomatic-specific parameters. 
# Default settings should work in most cases.
# If interested in modifying these values, check the Trimmomatic 
# documentation for details
ILLUMINACLIP: "/n/holylfs05/LABS/hopkins_lab/Users/felixw/software/Trimmomatic-0.39/adapters/TruSeq3-PE.fa:2:30:10" # <fastaWithAdaptersEtc>:<seed mismatches>:<palindrome clip threshold>:<simple clip threshold>
TRAILING: 3 # <quality>
SLIDINGWINDOW: "4:15" # <windowSize>:<requiredQuality>
MINLEN: 36 # <length>

